<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Agenda Berçário • Brinca e Aprende Espaço Kids</title>
  <meta name="description" content="Agenda digital do berçário Brinca e Aprende - Espaço Kids. Acompanhamento diário para pais e educadores.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧸</text></svg>">
  
  <!-- CSS Principal Mobile First -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Nuvens decorativas vetoriais de alta fidelidade (SVG puro sem desfoque) -->
  <div class="cloud-decorations" aria-hidden="true">
    <!-- Nuvem Ciano Topo Esquerda (Camada Única em Vetor) -->
    <svg class="cloud-scallop cloud-tl" viewBox="0 0 240 135" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision">
      <path d="M-10,-10 L215,-10 A32,32 0 0,1 175,28 A36,36 0 0,1 128,54 A42,42 0 0,1 72,78 A34,34 0 0,1 20,98 A28,28 0 0,1 -10,112 Z" fill="#00A8CC"/>
    </svg>
    <!-- Nuvem Amarela Topo Direita (Camada Única em Vetor) -->
    <svg class="cloud-scallop cloud-tr" viewBox="0 0 240 135" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision">
      <path d="M250,-10 L25,-10 A32,32 0 0,0 65,28 A36,36 0 0,0 112,54 A42,42 0 0,0 168,78 A34,34 0 0,0 220,98 A28,28 0 0,0 250,112 Z" fill="#F59E0B"/>
    </svg>

    <!-- Corações coloridos decorativos nas laterais -->
    <span class="decor-heart heart-1">♥</span>
    <span class="decor-heart heart-2">♥</span>
    <span class="decor-heart heart-3">♥</span>
    <span class="decor-heart heart-4">♥</span>
    <span class="decor-heart heart-5">♥</span>
    <span class="decor-heart heart-6">♥</span>
  </div>

  <!-- Container Principal do Aplicativo Mobile -->
  <main class="app-container" id="app">
    <div class="auth-wrapper">
      <!-- Header com Logo Oficial da Creche -->
      <header class="brand-header">
        <div class="brand-logo-container">
          <img src="assets/logo.png" alt="Brinca e Aprende Berçário" class="brand-logo-img">
        </div>
      </header>

      <!-- Card de Autenticação -->
      <div class="auth-card">
        <!-- Abas de Navegação -->
        <div class="auth-nav-tabs">
          <button type="button" class="auth-nav-btn active" id="tabLoginBtn">
            👪 Entrar
          </button>
          <button type="button" class="auth-nav-btn" id="tabRegisterBtn">
            ✨ Cadastrar
          </button>
          <button type="button" class="auth-nav-btn" id="tabAdminBtn">
            👩‍🏫 Educador
          </button>
        </div>

        <div id="authContentArea">
          <h2 class="auth-heading">Acesso da Família</h2>
          <p class="auth-subheading">Acompanhe o dia a dia do seu bebê com carinho e segurança</p>

          <form id="loginForm">
            <div class="form-group">
              <label class="form-label" for="loginEmail">E-mail dos Pais</label>
              <div class="input-container">
                <span class="input-icon">✉️</span>
                <input type="email" id="loginEmail" class="form-input" placeholder="seu.email@exemplo.com" required autocomplete="email">
              </div>
            </div>

            <div class="form-group">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                <label class="form-label" for="loginPassword" style="margin-bottom: 0;">Senha</label>
                <a href="#" id="forgotPasswordLink" style="font-size: 0.76rem; color: var(--brand-pink-dark); text-decoration: none; font-weight: 700;">Esqueceu a senha?</a>
              </div>
              <div class="input-container">
                <span class="input-icon">🔒</span>
                <input type="password" id="loginPassword" class="form-input" placeholder="Sua senha" required autocomplete="current-password">
                <button type="button" id="togglePasswordBtn" class="password-toggle-btn" title="Mostrar/ocultar senha">
                  👁️
                </button>
              </div>
            </div>

            <button type="submit" class="btn btn-primary">
              Entrar na Agenda 🚀
            </button>
          </form>

          <div class="form-divider">
            <span>ou acesse com sua conta</span>
          </div>

          <!-- Botão Oficial Google -->
          <button type="button" id="googleLoginBtn" class="btn btn-google">
            <svg width="20" height="20" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            Continuar com o Google
          </button>

          <!-- Callout Educador -->
          <div class="admin-switch-card">
            <p>Você faz parte da equipe escolar ou berçário?</p>
            <button type="button" id="switchToAdminTabBtn" class="btn btn-admin-pill">
              👩‍🏫 Acesso de Cuidador / Educador
            </button>
          </div>
        </div>
      </div>

      <!-- Rodapé com Nuvens Rosas Naturais e Nome em Letra Branca -->
      <footer class="app-cloud-footer">
        <svg class="cloud-bottom-wave" viewBox="0 0 400 36" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision">
          <path d="M 400,36 L 0,36 L 0,22 C 25,6 75,6 100,20 C 125,4 175,4 200,20 C 225,6 275,6 300,20 C 325,4 375,4 400,22 Z" fill="#EC4899"/>
        </svg>
        <div class="cloud-footer-bar">
          <p class="cloud-footer-text">
            <strong>Brinca e Aprende</strong> • Espaço Kids & Berçário 💖
          </p>
        </div>
      </footer>
    </div>
  </main>

  <!-- Container de Toasts -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Botão Flutuante do WhatsApp (+55 77 9148-1170) -->
  <a href="https://wa.me/557791481170?text=Ol%C3%A1!%20Gostaria%20de%20informa%C3%A7%C3%B5es%20sobre%20o%20Ber%C3%A7%C3%A1rio%20Brinca%20e%20Aprende" 
     class="whatsapp-float-btn" 
     target="_blank" 
     rel="noopener noreferrer" 
     title="Fale com a Direção / Berçário no WhatsApp" 
     aria-label="Atendimento via WhatsApp">
    <svg class="whatsapp-icon" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
      <path fill-rule="evenodd" clip-rule="evenodd" d="M16 2C8.268 2 2 8.268 2 16c0 2.808.825 5.424 2.25 7.618L2.5 30l6.578-1.722A13.916 13.916 0 0016 30c7.732 0 14-6.268 14-14S23.732 2 16 2zm6.98 19.387c-.297.834-1.464 1.534-2.42 1.74-.653.14-1.508.252-4.382-.94-3.673-1.524-6.046-5.26-6.23-5.503-.18-.243-1.488-1.98-1.488-3.777 0-1.797.94-2.68 1.276-3.045.337-.365.736-.456.98-.456.244 0 .49.002.705.012.227.01.532-.086.832.634.307.738 1.045 2.553 1.137 2.74.092.187.153.407.03.65-.122.244-.183.395-.366.609-.183.214-.385.478-.55.642-.183.183-.374.383-.16.75.214.366.953 1.572 2.046 2.545 1.408 1.254 2.593 1.642 2.96 1.825.367.183.58.153.794-.092.214-.244.917-1.069 1.162-1.436.244-.367.49-.305.824-.183.337.122 2.14 1.01 2.507 1.194.367.183.612.274.704.428.092.152.092.884-.205 1.718z" fill="#ffffff"/>
    </svg>
    <span class="whatsapp-float-tooltip">Fale Conosco 💬</span>
  </a>

  <!-- Scripts -->
  <script type="module" src="js/firebase-config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
